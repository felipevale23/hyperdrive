# pacman.conf used while building the ISO (mkarchiso) and copied to the live env.
[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
SigLevel           = Required DatabaseOptional
LocalFileSigLevel  = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

