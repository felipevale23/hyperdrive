name: build-iso

on:
  workflow_dispatch:
  push:
    paths:
      - 'iso/**'
      - 'scripts/build.sh'
      - '.github/workflows/build-iso.yml'
  schedule:
    - cron: '0 4 * * 1'   # weekly, to track Arch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning scripts/*.sh iso/profiledef.sh || true

  build:
    runs-on: ubuntu-latest
    needs: lint
    container:
      image: archlinux:latest
      options: --privileged   # mkarchiso needs loop devices
    steps:
      - uses: actions/checkout@v4

      - name: install archiso
        run: pacman -Sy --noconfirm archiso grub

      - name: build ISO
        run: ./scripts/build.sh

      - name: checksums
        run: cd dist && sha256sum *.iso > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdrive-iso
          path: |
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 14

      - name: release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/SHA256SUMS

  # TODO: a `build-repo` job that makepkg's packages/** into a signed
  # [hyperdrive] repo and publishes it to GitHub Pages, plus a QEMU smoke-boot.
